<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
<title id="title">Giraffe Patches</title><desc id="desc">Dark purple, mint and amber geometric giraffe-themed header, with an independent Android patches subtitle.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset=".55" stop-color="#131b34"/><stop offset="1" stop-color="#1b1531"/></linearGradient>
