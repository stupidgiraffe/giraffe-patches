<text x="55" y="222" fill="#fff9eb" font-family="system-ui,Segoe UI,sans-serif" font-weight="800" font-size="91" letter-spacing="-4">Giraffe</text>
<text x="55" y="312" fill="url(#accent)" font-family="system-ui,Segoe UI,sans-serif" font-weight="800" font-size="91" letter-spacing="-4">Patches.</text>
<text x="61" y="356" fill="#c5cbdd" font-family="system-ui,Segoe UI,sans-serif" font-size="20">Android patching for Reseam · Verified version support</text>
