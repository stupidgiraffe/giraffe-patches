 <filter id="glow"><feGaussianBlur stdDeviation="35"/></filter>
 <pattern id="dots" width="35" height="35" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1" fill="#9aa1bd" opacity=".14"/></pattern>
</defs>
