name: Build preview bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Signed preview (temporary test key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Reseam CLI 0.20.0
        run: bash scripts/install_reseam_cli.sh
      - name: Generate throwaway CI signing key
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/giraffe-preview"
          "$RESEAM_BIN" bundle keygen --out "$RUNNER_TEMP/giraffe-preview/signing.key"
          echo "RESEAM_BUNDLE_KEY=$RUNNER_TEMP/giraffe-preview/signing.key" >> "$GITHUB_ENV"
      - name: Build and verify preview bundle
        run: |
          gradle bundle
          BUNDLE="build/reseam/giraffe-patches.reseam"
          test -s "$BUNDLE"
          unzip -t "$BUNDLE"
          PUBKEY="$(unzip -p "$BUNDLE" manifest.pubkey | xxd -p -c 256)"
          test "${#PUBKEY}" -eq 64
          "$RESEAM_BIN" bundle list "$BUNDLE" --trust "$PUBKEY"
          {
            echo '## Giraffe Patches preview build'
            echo
            echo 'This bundle was compiled from source and signed with a **temporary CI key**. It has **not** been device-tested. Do not treat it as a stable public release.'
            echo
            echo "- Target: Smart Launcher **6.6 build 021 (660210)**"
            echo "- Bundle SHA-256: $(sha256sum "$BUNDLE" | cut -d' ' -f1)"
            echo "- Temporary signer: \`$PUBKEY\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: giraffe-patches-preview-reseam
          path: build/reseam/giraffe-patches.reseam
          if-no-files-found: error
          retention-days: 14
