name: Build Supreme Duelist 4.0.7 preview (manual branch)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install matching ReSeam 0.41.0 CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 https://cdn.reseam.app/engine/v0.41.0/reseam-linux-x64 -o "$RUNNER_TEMP/reseam"
          chmod +x "$RUNNER_TEMP/reseam"
          "$RUNNER_TEMP/reseam" --version
          echo "RESEAM_BIN=$RUNNER_TEMP/reseam" >> "$GITHUB_ENV"
      - name: Configure permanent signing key
        env:
          SIGNING_SEED: ${{ secrets.RESEAM_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_SEED" || { echo "Permanent signing key unavailable" >&2; exit 1; }
          umask 077
          printf '%s' "$SIGNING_SEED" | base64 --decode > "$RUNNER_TEMP/giraffe.key"
          test "$(wc -c < "$RUNNER_TEMP/giraffe.key")" -eq 32
          echo "RESEAM_BUNDLE_KEY=$RUNNER_TEMP/giraffe.key" >> "$GITHUB_ENV"
      - name: Compile and sign isolated Supreme Duelist patch bundle
        working-directory: projects/supremeduelist
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain bundle
          test -s build/reseam/giraffe-supremeduelist.reseam
          unzip -t build/reseam/giraffe-supremeduelist.reseam
      - name: Verify signature and catalog
        working-directory: projects/supremeduelist
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=build/reseam/giraffe-supremeduelist.reseam
          EXPECTED=9b5228381bdce62d03e9df9654f02c9ceb9c06fd67722aa201a6c01cc989d89b
          test "$(unzip -p "$BUNDLE" manifest.pubkey | xxd -p -c 256)" = "$EXPECTED"
          unzip -p "$BUNDLE" manifest.toml | grep -F 'engine = "0.41.0"'
          unzip -p "$BUNDLE" manifest.toml | grep -F '4.0.7'
          "$RESEAM_BIN" bundle list "$BUNDLE" --trust "$EXPECTED" --verbose
          sha256sum "$BUNDLE"
      - uses: actions/upload-artifact@v4
        with:
          name: giraffe-supremeduelist-407-reseam
          path: projects/supremeduelist/build/reseam/giraffe-supremeduelist.reseam
          retention-days: 7
          if-no-files-found: error
