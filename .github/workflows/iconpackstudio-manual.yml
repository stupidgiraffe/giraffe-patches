name: Build Icon Pack Studio Reseam 0.30.0 (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install matched Reseam 0.30.0 CLI
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 \
            https://cdn.reseam.app/engine/v0.30.0/reseam-linux-x64 \
            --output "$RUNNER_TEMP/reseam"
          chmod +x "$RUNNER_TEMP/reseam"
          "$RUNNER_TEMP/reseam" --version | grep -F '0.30.0'
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          echo "RESEAM_BIN=$RUNNER_TEMP/reseam" >> "$GITHUB_ENV"

      - name: Configure permanent Reseam bundle signer
        env:
          SIGNING_SEED: ${{ secrets.RESEAM_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_SEED" || { echo "Existing permanent signing secret unavailable." >&2; exit 1; }
          umask 077
          printf '%s' "$SIGNING_SEED" | base64 --decode > "$RUNNER_TEMP/giraffe-signing.key"
          test "$(wc -c < "$RUNNER_TEMP/giraffe-signing.key")" -eq 32
          echo "RESEAM_BUNDLE_KEY=$RUNNER_TEMP/giraffe-signing.key" >> "$GITHUB_ENV"

      - name: Build native Reseam bundle
        working-directory: projects/iconpackstudio
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain bundle
          test -s build/reseam/giraffe-iconpackstudio.reseam

      - name: Verify 0.30.0 manifest, signature and patch registration
        working-directory: projects/iconpackstudio
        run: |
          set -euo pipefail
          BUNDLE="build/reseam/giraffe-iconpackstudio.reseam"
          EXPECTED="9b5228381bdce62d03e9df9654f02c9ceb9c06fd67722aa201a6c01cc989d89b"
          unzip -t "$BUNDLE"
          unzip -p "$BUNDLE" manifest.toml | grep -Fx 'engine = "0.30.0"'
          unzip -p "$BUNDLE" manifest.toml | grep -F 'versions = ["2.4 build 001", "2.5 build 001"]'
          ACTUAL="$(unzip -p "$BUNDLE" manifest.pubkey | xxd -p -c 256)"
          test "$ACTUAL" = "$EXPECTED" || { echo "Signing key mismatch" >&2; exit 1; }
          "$RESEAM_BIN" bundle list "$BUNDLE" --trust "$EXPECTED" --verbose
          "$RESEAM_BIN" bundle list "$BUNDLE" --json | grep -F "Enable Icon Pack Studio Pro"
          sha256sum "$BUNDLE"

      - uses: actions/upload-artifact@v4
        with:
          name: giraffe-iconpackstudio-reseam-0.30.0
          path: projects/iconpackstudio/build/reseam/giraffe-iconpackstudio.reseam
          retention-days: 7
          if-no-files-found: error
