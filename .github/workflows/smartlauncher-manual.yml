name: Build Smart Launcher Reseam 0.32.0 (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install matched Reseam 0.32.0 CLI
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 \
            https://cdn.reseam.app/engine/v0.32.0/reseam-linux-x64 \
            --output "$RUNNER_TEMP/reseam"
          chmod +x "$RUNNER_TEMP/reseam"
          "$RUNNER_TEMP/reseam" --version | grep -F '0.32.0'
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          echo "RESEAM_BIN=$RUNNER_TEMP/reseam" >> "$GITHUB_ENV"

      - name: Configure permanent Reseam bundle signer
        env:
          SIGNING_SEED: ${{ secrets.RESEAM_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_SEED" || { echo "Permanent signing secret unavailable" >&2; exit 1; }
          umask 077
          printf '%s' "$SIGNING_SEED" | base64 --decode > "$RUNNER_TEMP/giraffe-signing.key"
          test "$(wc -c < "$RUNNER_TEMP/giraffe-signing.key")" -eq 32
          echo "RESEAM_BUNDLE_KEY=$RUNNER_TEMP/giraffe-signing.key" >> "$GITHUB_ENV"

      - name: Build native Smart Launcher bundle
        working-directory: projects/smartlauncher
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain bundle
          test -s build/reseam/giraffe-smartlauncher.reseam

      - name: Verify 0.32.0 archive, signer and patch catalog
        working-directory: projects/smartlauncher
        run: |
          set -euo pipefail
          BUNDLE="build/reseam/giraffe-smartlauncher.reseam"
          EXPECTED="9b5228381bdce62d03e9df9654f02c9ceb9c06fd67722aa201a6c01cc989d89b"
          unzip -t "$BUNDLE"
          unzip -p "$BUNDLE" manifest.toml | grep -Fx 'engine = "0.32.0"'
          unzip -p "$BUNDLE" manifest.toml | grep -F 'versions = ["6.6 build 024"]'
          unzip -p "$BUNDLE" manifest.toml | grep -F 'verified source target 6.6 build 024'
          ACTUAL="$(unzip -p "$BUNDLE" manifest.pubkey | xxd -p -c 256)"
          test "$ACTUAL" = "$EXPECTED" || { echo "Signing key mismatch" >&2; exit 1; }
          "$RESEAM_BIN" bundle list "$BUNDLE" --trust "$EXPECTED" --verbose
          "$RESEAM_BIN" bundle list "$BUNDLE" --json | grep -F '"Enable Pro"'
          sha256sum "$BUNDLE"

      - name: Test real patching with publisher APK when target matches
        working-directory: projects/smartlauncher
        env:
          RESEAM_JVM_HEAP: 1g
        run: |
          set -uo pipefail
          BUNDLE="build/reseam/giraffe-smartlauncher.reseam"
          APK="$RUNNER_TEMP/SmartLauncher_latest.apk"
          REPORT="$RUNNER_TEMP/smartlauncher-validation.txt"
          echo "Official Smart Launcher direct download, not bundled or published." > "$REPORT"
          if ! curl --fail --location --retry 2 --connect-timeout 20 --max-time 130 \
            "https://sl-builds.nyc3.cdn.digitaloceanspaces.com/sl-releases/SmartLauncher_latest.apk" \
            --output "$APK" 2>> "$REPORT"; then
            echo "APK_DOWNLOAD_UNAVAILABLE: no patch-stage result" | tee -a "$REPORT"
          else
            sha256sum "$APK" | tee -a "$REPORT"
            "$RESEAM_BIN" info "$APK" > "$RUNNER_TEMP/app-info.txt" 2>&1
            cat "$RUNNER_TEMP/app-info.txt" | tee -a "$REPORT"
            if grep -Fq 'version:    6.6 build 024' "$RUNNER_TEMP/app-info.txt"; then
              echo "TARGET_MATCH: executing real patch-stage test" | tee -a "$REPORT"
              "$RESEAM_BIN" patch "$APK" --bundle "$BUNDLE" \
                --trust "9b5228381bdce62d03e9df9654f02c9ceb9c06fd67722aa201a6c01cc989d89b" \
                --enable "Enable Pro" \
                --output "$RUNNER_TEMP/patched.apk" > "$RUNNER_TEMP/patch-log.txt" 2>&1
              STATUS=$?
              tail -90 "$RUNNER_TEMP/patch-log.txt" | tee -a "$REPORT"
              if [ "$STATUS" -eq 0 ]; then
                echo "PATCH_STAGE_RESULT=PASSED" | tee -a "$REPORT"
              else
                echo "PATCH_STAGE_RESULT=FAILED exit=$STATUS (bundle NOT validated)" | tee -a "$REPORT"
              fi
              rm -f "$RUNNER_TEMP/patched.apk" "$RUNNER_TEMP/patched.pk8" "$RUNNER_TEMP/patched.der"
            else
              echo "APK_VERSION_MISMATCH: cannot claim full patch-stage validation for build 024." | tee -a "$REPORT"
            fi
            rm -f "$APK"
          fi
          cp "$REPORT" validation-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: smartlauncher-validation-report-0.32.0
          path: projects/smartlauncher/validation-report.txt
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: giraffe-smartlauncher-b024-reseam-0.32.0
          path: projects/smartlauncher/build/reseam/giraffe-smartlauncher.reseam
          retention-days: 7
          if-no-files-found: error
