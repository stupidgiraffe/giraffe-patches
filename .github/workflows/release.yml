name: Release signed bundle (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Reviewed version tag, e.g. v0.1.0 (must already be device-tested)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected vX.Y.Z"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Reseam CLI 0.20.0
        run: bash scripts/install_reseam_cli.sh
      - name: Configure protected signing key
        env:
          SIGNING_SEED: ${{ secrets.RESEAM_SIGNING_KEY_BASE64 }}
          PUBLIC_KEY: ${{ vars.RESEAM_PUBLIC_KEY_HEX }}
        run: |
          test -n "$SIGNING_SEED" && test -n "$PUBLIC_KEY"
          umask 077
          mkdir -p "$RUNNER_TEMP/giraffe"
          printf '%s' "$SIGNING_SEED" | base64 --decode > "$RUNNER_TEMP/giraffe/signing.key"
          test -s "$RUNNER_TEMP/giraffe/signing.key"
      - name: Build, inspect and stage release
        env:
          RESEAM_BIN: ${{ runner.temp }}/reseam-cli/reseam
          RESEAM_BUNDLE_KEY: ${{ runner.temp }}/giraffe/signing.key
          RESEAM_RELEASE_VERSION: ${{ inputs.version }}
          RESEAM_BUNDLE_URL: https://github.com/stupidgiraffe/giraffe-patches/releases/download/${{ inputs.version }}/giraffe-patches.reseam
          RESEAM_HOMEPAGE: https://github.com/stupidgiraffe/giraffe-patches
          PUBLIC_KEY: ${{ vars.RESEAM_PUBLIC_KEY_HEX }}
        run: |
          gradle bundle
          test -s build/reseam/giraffe-patches.reseam
          unzip -t build/reseam/giraffe-patches.reseam
          "$RESEAM_BIN" bundle list build/reseam/giraffe-patches.reseam --trust "$PUBLIC_KEY"
          gradle stageRelease
          test -s build/reseam/release/patches.json
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          test ! -z "$VERSION"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$VERSION" \
            build/reseam/giraffe-patches.reseam \
            build/reseam/release/patches.json \
            --title "Giraffe Patches ${VERSION} — Smart Launcher build 021" \
            --notes "Compatible target: Smart Launcher 6.6 build 021 (660210). Independently verify the published signing fingerprint. Device-tested release approval is required before running this workflow."
