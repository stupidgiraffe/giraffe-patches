name: Patch request
description: Suggest an app or compatibility improvement
title: "[Request] "
labels: ["enhancement"]
body:
  - type: input
    id: app
    attributes:
      label: App name and package ID
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Target version and version code
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Desired change and why
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Existing upstream patches or technical references
      description: "Link public sources; do not upload proprietary app binaries."
